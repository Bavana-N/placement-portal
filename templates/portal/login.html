{% extends 'base.html' %}
{% block title %}Login | PlacePro{% endblock %}
{% block content %}
<section class="container section-pad">
  <div class="row auth-split align-items-center g-4">
    <div class="col-lg-6 d-none d-lg-block">
      <div class="auth-visual">
        <i class="bi bi-laptop" style="font-size:6rem;opacity:0.6;"></i>
        <h3 class="fw-bold mt-4">Welcome Back!</h3>
        <p class="opacity-90">Login to continue your placement journey and explore opportunities.</p>
      </div>
    </div>
    <div class="col-lg-6">
      <div class="auth-card mx-auto" style="max-width:460px;">
        <h3 class="fw-bold mb-4">Login</h3>
        <form method="post" class="needs-validation" novalidate>
          {% csrf_token %}
          <div class="mb-3">
            <label class="form-label fw-semibold">Username</label>
            {{ form.username }}
          </div>
          <div class="mb-3">
            <label class="form-label fw-semibold">Password</label>
            {{ form.password }}
          </div>
          <div class="d-flex justify-content-between align-items-center mb-4">
            <div class="form-check">
              <input class="form-check-input" type="checkbox" id="rememberMe">
              <label class="form-check-label small" for="rememberMe">Remember me</label>
            </div>
          </div>
          <button type="submit" class="btn btn-gradient w-100 py-2">Login</button>
        </form>
        <p class="text-center text-muted small mt-4 mb-0">Don't have an account? <a href="{% url 'register' %}" class="fw-semibold text-primary-custom">Register here</a></p>
      </div>
    </div>
  </div>
</section>
{% endblock %}
